<html lang="en">

<style>
/* Ruxer Farms v2 look. Colors from the emblem: brushed steel, sunset gold, field green.
   Layout: one working column, sticky header, frosted bottom tab bar (Equipment · Fuel · Inventory · More). */
:root {
  --bg: #0d1411;
  --surface: #13201a;
  --raised: #1a2a22;
  --line: rgba(201, 206, 211, .13);
  --ink: #f3f5f2;
  --muted: #9aa8a0;
  --steel: #c9ced3;
  --green: #f2a93b;
  --green-ink: #1d1404;
  --gold: #f2a93b;
  --good: #5fbf6e;
  --warn: #f2a93b;
  --bad: #ff6b5a;
  --chip: rgba(201, 206, 211, .09);
  --glass: rgba(19, 32, 26, .72);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 18px;
  --tabbar-h: 68px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 320px; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(36, 56, 74, .55) 0%, rgba(107, 74, 51, .32) 50%, rgba(13, 20, 17, 0) 100%); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-block: 0 calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); }
body.with-install main { padding-bottom: calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.005em; text-wrap: balance; margin: 0; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .11em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 22px; height: 22px; flex: none; }

button, .btn { font: 600 .95rem/1 var(--f-body); border-radius: 14px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); padding: 11px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 44px; transition: transform .12s ease, background-color .2s ease, border-color .2s ease; }
button:hover, .btn:hover { border-color: rgba(201, 206, 211, .3); }
button:active, .btn:active { transform: scale(.97); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.primary { background: var(--gold); border-color: var(--gold); color: var(--green-ink); }
.primary:hover { border-color: #ffc06a; background: #f5b552; }
.big { width: 100%; min-height: 56px; font-size: 1.05rem; border-radius: var(--r); }
.danger { color: var(--bad); }
.danger.solid { background: var(--bad); border-color: var(--bad); color: #2a0703; }
.small { padding: 7px 12px; min-height: 36px; font-size: .85rem; border-radius: 12px; }
.link { border: 0; padding: 0; min-height: 0; color: var(--gold); font-weight: 600; background: none; }

input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; transition: border-color .2s ease; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); outline: none; }
textarea { min-height: 84px; resize: vertical; }
label.f { display: grid; gap: 6px; min-width: 0; }
label.f > span, .f > .flabel { text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; color: var(--muted); font-weight: 600; }
div.f { display: grid; gap: 6px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.chipst { display: inline-flex; align-items: center; font-size: .75rem; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chipst.s-ok { color: var(--good); background: rgba(95, 191, 110, .14); }
.chipst.s-soon { color: var(--warn); background: rgba(242, 169, 59, .15); }
.chipst.s-due { color: var(--bad); background: rgba(255, 107, 90, .15); }

/* Header */
.top { display: flex; align-items: center; gap: 10px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 18px; padding: 12px max(16px, env(safe-area-inset-left, 0px)); min-height: 64px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10;
  background: rgba(13, 20, 17, .72); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid var(--line); }
.top .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; min-width: 0; }
.top .brand img { width: 42px; height: 42px; border-radius: 11px; box-shadow: 0 0 0 1px var(--line); }
.top .brand b { display: block; font: 800 1.3rem/1 var(--f-display); letter-spacing: .01em; }
.top .brand small { display: block; font-size: .76rem; color: var(--muted); font-weight: 500; margin-top: 4px; }
.top .spacer { flex: 1; }
.back { color: var(--steel); text-decoration: none; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; }
.back:hover { color: var(--ink); }

/* Bottom tab bar */
.tabbar { position: fixed; z-index: 20; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; height: var(--tabbar-h); border-radius: 24px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
  background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); }
.tabbar a { position: relative; display: grid; justify-items: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 600; padding: 8px 0; min-height: 56px; align-content: center; transition: color .2s ease; }
.tabbar a[aria-current="page"] { color: var(--gold); }
.tabbar .tdot { position: absolute; top: 8px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.fab { position: fixed; z-index: 19; right: max(20px, calc(50% - 360px)); bottom: calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 20px; padding: 0;
  background: var(--gold); color: var(--green-ink); display: grid; place-items: center; box-shadow: 0 10px 24px rgba(242, 169, 59, .32); text-decoration: none; }
body.with-install .fab { bottom: calc(var(--tabbar-h) + 92px + env(safe-area-inset-bottom, 0px)); }

/* Install bar */
.installbar { position: fixed; z-index: 21; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); max-width: 560px; margin: 0 auto;
  bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-radius: 18px;
  background: rgba(26, 42, 34, .94); border: 1px solid rgba(242, 169, 59, .35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: rise .35s ease both; }
.installbar img { width: 36px; height: 36px; border-radius: 9px; }
.installbar .txt { flex: 1; min-width: 0; font-size: .82rem; line-height: 1.3; color: var(--muted); }
.installbar .txt b { display: block; font-size: .92rem; color: var(--ink); }
.installbar .x { width: 36px; min-height: 36px; padding: 0; background: transparent; border: 0; color: var(--muted); font-size: 1.1rem; }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.guide { display: grid; gap: 14px; padding-top: 14px; }
.guide ol { margin: 0; padding-left: 1.3em; display: grid; gap: 12px; }
.guide li { padding-left: 4px; line-height: 1.45; }
.guide .sharei { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); vertical-align: -8px; margin: 0 2px; color: var(--gold); }
.pointer { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); color: var(--gold); display: grid; justify-items: center; gap: 2px; font-weight: 700; font-size: .85rem; pointer-events: none; text-shadow: 0 2px 8px #000; animation: bob 1s ease-in-out infinite; }
.pointer.top { bottom: auto; top: calc(6px + env(safe-area-inset-top, 0px)); animation-name: bobup; }
.pointer.right { left: auto; right: 16px; transform: none; }
.pointer svg { width: 34px; height: 34px; }
@keyframes bob { 50% { translate: 0 8px; } }
@keyframes bobup { 50% { translate: 0 -8px; } }

/* Machine header */
.mhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; margin-bottom: 16px; }
.mcard { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 6px; align-content: center; min-width: 0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.mcard h1 { font-size: 1.55rem; line-height: 1.1; overflow-wrap: anywhere; }
.meter { background: var(--gold); color: var(--green-ink); border: 0; border-radius: var(--r); padding: 14px 18px; display: grid; gap: 4px; align-content: center; justify-items: start; text-align: left; min-width: 124px; }
.meter .eyebrow { color: var(--green-ink); opacity: .7; }
.meter b { font: 800 1.9rem/1 var(--f-display); }
.meter:hover { background: #f5b552; }
.meterform { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
.meterform label { flex: 1 1 160px; }

/* Segmented tabs */
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 4px; border-radius: 16px; background: var(--chip); margin-bottom: 18px; }
.tabs button { border: 0; border-radius: 12px; min-height: 42px; font-size: .86rem; font-weight: 600; color: var(--muted); background: transparent; padding: 6px 2px; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--raised); box-shadow: 0 0 0 1px var(--line); }

/* Tallies */
.tally, .ltally { display: grid; gap: 10px; margin-bottom: 18px; }
.tally { grid-template-columns: repeat(3, 1fr); }
.ltally { grid-template-columns: repeat(3, 1fr); }
.tally div, .ltally div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; }
.tally b, .ltally b { font: 800 1.8rem/1 var(--f-display); }
.tally span, .ltally span { color: var(--muted); font-size: .8rem; }

/* Service rows */
.svc h2, .panel > h2 { font-size: 1.2rem; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.svc .hd2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.svc .hd2 h2 { padding: 0; border: 0; }
.rowwrap { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.rowwrap:last-child { border-bottom: 0; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 16px 0; align-items: center; touch-action: pan-y; background: var(--surface); transition: transform .25s ease; }
.row .t { font-size: 1.02rem; font-weight: 600; overflow-wrap: anywhere; }
.row .sub { color: var(--muted); font-size: .88rem; }
.row .sub2 { font-size: .84rem; margin-top: 2px; }
.row .side { display: grid; gap: 8px; justify-items: end; }
.row .confirm { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--raised); border-radius: 14px; padding: 10px 12px; font-size: .9rem; }
.row .confirm span { flex: 1 1 180px; }
.row.dragging { transition: none; }
.swipeback { position: absolute; inset: 8px 0; border-radius: 14px; background: var(--good); color: #06210d; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding-right: 18px; font-weight: 700; }
.bar { height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 8px; max-width: 280px; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.bar.s-soon i { background: var(--warn); } .bar.s-due i { background: var(--bad); }
.swipetip { font-size: .76rem; color: var(--muted); font-weight: 500; }

/* Specs, parts, notes */
.stack { display: grid; gap: 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px 20px; padding-top: 14px; }
.facts .v { font-weight: 600; overflow-wrap: anywhere; }
.vin { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vin .mono { font-size: 1.02rem; letter-spacing: .06em; user-select: all; overflow-wrap: anywhere; }
.part { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.part:last-child { border-bottom: 0; padding-bottom: 0; }
.part .pn { font-family: var(--f-mono); color: var(--gold); text-align: right; overflow-wrap: anywhere; }
.part .x { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; }
.note { white-space: pre-wrap; overflow-wrap: anywhere; padding-top: 14px; color: var(--steel); }
.panel .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.panel .hd h2 { font-size: 1.2rem; padding: 0; border: 0; }

/* Log */
.entry { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.entry:last-child { border-bottom: 0; padding-bottom: 0; }
.entry .eh { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.entry .date { font: 700 1rem/1 var(--f-display); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: rgba(95, 191, 110, .14); color: var(--good); font-weight: 600; }
.entry p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Tables */
.scroll { overflow-x: auto; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 12px 10px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }

/* Equipment list */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input { flex: 1 1 220px; width: auto; }
.sectionhd { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; }
.sectionhd h2 { font-size: 1.2rem; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 4px 14px; color: inherit; align-items: center; cursor: pointer; transition: border-color .2s ease, transform .12s ease; }
.card:hover { border-color: rgba(201, 206, 211, .28); }
.card:active { transform: scale(.99); }
.card .thumbic { grid-row: span 2; width: 50px; height: 50px; border-radius: 15px; background: rgba(95, 191, 110, .12); color: var(--good); display: grid; place-items: center; align-self: start; }
.card h3 { font-size: 1.1rem; line-height: 1.15; overflow-wrap: anywhere; }
.card .meta { grid-column: 2 / -1; color: var(--muted); font-size: .84rem; overflow-wrap: anywhere; }
.card .meterrow { grid-column: 1 / -1; display: flex; margin-top: 10px; }
.meterchip { min-height: 40px; padding: 8px 14px; border-radius: 12px; background: var(--raised); font: 600 .9rem/1 var(--f-body); gap: 8px; }
.meterchip .pen { color: var(--gold); }
.quickmeter { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
.quickmeter input { flex: 1 1 120px; width: auto; }
.kids { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.kid, .kidrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: .9rem; min-height: 36px; }
.kidrow { padding: 14px 0; border-bottom: 1px solid var(--line); }
.kidrow:last-child { border-bottom: 0; padding-bottom: 0; }
.inl { color: var(--gold); text-decoration: none; font-weight: 600; }
.inl:hover { text-decoration: underline; }
.confirmbox { display: grid; gap: 10px; margin-top: 14px; padding: 12px 14px; background: var(--raised); border-radius: 14px; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 40px 20px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-size: 1.45rem; }
.empty p { margin: 0; max-width: 44ch; color: var(--muted); }

/* Forms */
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; padding-top: 14px; }
.fgrid .wide { grid-column: 1 / -1; }
.rep { display: grid; gap: 10px; padding-top: 14px; }
.reprow { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; padding: 14px; background: var(--raised); border-radius: 14px; }
.reprow .w2 { grid-column: span 2; }
.reprow .rm { justify-self: end; }
@media (max-width: 520px) { .reprow .w2 { grid-column: 1 / -1; } }
.checks { display: grid; gap: 8px; }
.checks label { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--raised); border-radius: 14px; cursor: pointer; min-height: 52px; }
.checks input { width: 22px; height: 22px; flex: none; accent-color: var(--gold); }
.formfoot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.dangerzone { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 22px; }
.inrow { display: flex; gap: 8px; align-items: center; min-width: 0; }
.inrow input { flex: 1 1 auto; }
.inrow .scanbtn { padding: 7px 10px; flex: none; }

.toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 14px;
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: .92rem; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.toastbtn { min-height: 32px; padding: 6px 12px; border-color: var(--bg); color: var(--bg); background: transparent; font-weight: 700; }
.banner { padding: 11px 14px; border-radius: 14px; background: var(--chip); color: var(--warn); font-size: .88rem; margin-bottom: 14px; }
.login { max-width: 380px; margin: 10vh auto 0; display: grid; gap: 16px; }
.login h1 { font-size: 2rem; }
.login .logo { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 0 0 1px var(--line); }

/* Photos & scanning */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; padding-top: 14px; }
.thumb { padding: 0; min-height: 0; border-radius: 12px; overflow: hidden; display: grid; background: var(--raised); text-align: left; }
.thumb img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.thumb span { font: 500 .75rem/1.2 var(--f-body); padding: 6px 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rthumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.rthumbs .thumb { width: 64px; }
.acct { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.acct b { font-size: 1.05rem; letter-spacing: .04em; }
.viewer { position: fixed; inset: 0; z-index: 80; background: rgba(6, 10, 8, .96); display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.vbar, .vfoot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vfoot input { flex: 1 1 200px; width: auto; }
.vimg { min-height: 0; display: grid; place-items: center; }
.vimg img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
.sheetwrap { position: fixed; inset: 0; z-index: 75; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; animation: rise .3s ease both;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.sheet .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.sheet .hd h2 { font-size: 1.2rem; }
.cand { justify-content: flex-start; width: 100%; font: 600 1.02rem/1.2 var(--f-mono); letter-spacing: .04em; overflow-wrap: anywhere; text-align: left; }
.keeprow { display: flex; gap: 10px; align-items: center; font-size: .9rem; }
.keeprow input { width: 20px; height: 20px; accent-color: var(--gold); }

/* Fuel */
.tanks { display: grid; gap: 12px; margin-bottom: 18px; }
.tankcard { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 6px 14px; align-items: center; color: inherit; text-decoration: none;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.tankcard .gauge { grid-row: span 3; width: 68px; height: 68px; }
.tankcard h3 { font-size: 1.08rem; line-height: 1.15; overflow-wrap: anywhere; }
.tc-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tankbar { position: relative; height: 10px; border-radius: 6px; background: var(--chip); }
.tankbar.big { height: 22px; border-radius: 10px; }
.tankbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, #4aa35a, var(--good)); animation: fill 1s cubic-bezier(.2, .8, .2, 1) both; transform-origin: left; }
.tankbar i.s-soon { background: linear-gradient(90deg, #e08a2c, var(--gold)); } .tankbar i.s-due { background: linear-gradient(90deg, #e2503f, var(--bad)); } .tankbar i.s-unknown { background: var(--muted); }
@keyframes fill { from { transform: scaleX(0); } }
.tankbar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.tankbig { font: 800 2.8rem/1 var(--f-display); }
.tankbig span { font-size: 1.1rem; color: var(--muted); font-weight: 600; }

/* Inventory */
.invrow { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.invrow:last-child { border-bottom: 0; padding-bottom: 0; }
.invrow .iico { width: 42px; height: 42px; border-radius: 12px; background: var(--raised); color: var(--steel); display: grid; place-items: center; }
.invname { display: grid; gap: 2px; color: var(--ink); text-decoration: none; min-width: 0; }
.invname b { font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
.invname span { font-size: .82rem; overflow-wrap: anywhere; }
.invqty { display: flex; align-items: center; gap: 6px; }
.qbtn { width: 44px; height: 44px; padding: 0; font-size: 1.35rem; border-radius: 13px; }
.qv { display: grid; justify-items: center; min-width: 44px; line-height: 1.1; }
.qv b { font: 800 1.35rem/1 var(--f-display); }
.qv span { font-size: .7rem; }
.invlow { grid-column: 2 / -1; justify-self: start; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
.usebox { display: grid; gap: 8px; }
.userow { display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; gap: 8px; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
