<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruxer Farms LLC</title>
<meta name="theme-color" content="#121512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ruxer Farms">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="app-icon-192.png?v=2" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one dark working column for phone use in the shop. Machine list, or one machine: name card + hour-meter card, tabs (Status / Specs / Log / Intervals), panels below. Deliberately single dark look. */
:root {
  --bg: #121512;
  --surface: #1a1e1a;
  --raised: #222722;
  --line: #2d342d;
  --ink: #eef1ec;
  --muted: #98a297;
  --green: #5f9a69;
  --green-ink: #0e170f;
  --good: #6cc27b;
  --warn: #e3a53b;
  --bad: #e8735f;
  --chip: #2a302a;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.login { max-width: 380px; margin: 8vh auto 0; display: grid; gap: 14px; }
.login h1 { font-size: 2.4rem; text-transform: uppercase; letter-spacing: .04em; }
.login .err { color: var(--bad); font-size: .9rem; min-height: 1.2em; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { padding-block: 8px 64px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }

button, .btn { font: 600 .95rem/1 var(--f-body); border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 11px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; min-height: 44px; }
button:hover, .btn:hover { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--good); outline-offset: 2px; }
.primary { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.primary:hover { border-color: var(--good); filter: brightness(1.06); }
.big { width: 100%; min-height: 58px; font-size: 1.15rem; border-radius: var(--r); }
.danger { color: var(--bad); }
.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--green-ink); }
.small { padding: 7px 12px; min-height: 34px; font-size: .85rem; }
.link { border: 0; padding: 0; min-height: 0; color: var(--good); font-weight: 600; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
label.f { display: grid; gap: 5px; min-width: 0; }
label.f > span { text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; color: var(--muted); font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.chipst { display: inline-flex; align-items: center; font-size: .82rem; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chipst.s-ok { color: var(--good); } .chipst.s-soon { color: var(--warn); } .chipst.s-due { color: var(--bad); }

/* Top bar */
.top { display: flex; align-items: center; gap: 8px 10px; margin-bottom: 16px; min-height: 44px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); }
.top .brand { font: 700 1.35rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--ink); text-decoration: none; }
.top .spacer { flex: 1; }
.back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; }
.back:hover { color: var(--ink); }

/* Machine header */
.mhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; margin-bottom: 16px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; display: grid; gap: 4px; align-content: center; min-width: 0; }
.mcard h1 { font-size: 1.85rem; line-height: 1.02; overflow-wrap: anywhere; }
.meter { background: var(--green); color: var(--green-ink); border: 0; border-radius: var(--r); padding: 14px 18px; display: grid; gap: 4px; align-content: center; justify-items: start; text-align: left; min-width: 120px; }
.meter .eyebrow { color: var(--green-ink); opacity: .75; }
.meter b { font: 700 1.85rem/1 var(--f-display); }
.meter:hover { filter: brightness(1.07); }
.meterform { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
.meterform label { flex: 1 1 160px; }

/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.tabs button { border: 0; border-radius: 0; min-height: 52px; font-size: 1rem; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 8px 4px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--green); }

/* Tally */
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.tally div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.tally b { font: 700 2.2rem/1 var(--f-display); }
.tally span { color: var(--muted); font-size: .92rem; }

/* Service rows */
.svc h2, .panel > h2 { font-size: 1.55rem; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: center; }
.row:last-child { border-bottom: 0; padding-bottom: 4px; }
.row .t { font-size: 1.1rem; font-weight: 500; overflow-wrap: anywhere; }
.row .sub { color: var(--muted); font-size: .95rem; }
.row .sub2 { font-size: .85rem; margin-top: 2px; }
.row .side { display: grid; gap: 8px; justify-items: end; }
.row .confirm { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--raised); border-radius: 12px; padding: 10px 12px; font-size: .9rem; }
.row .confirm span { flex: 1 1 180px; }
.bar { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; margin-top: 8px; max-width: 260px; }
.bar i { display: block; height: 100%; background: var(--good); }
.bar.s-soon i { background: var(--warn); } .bar.s-due i { background: var(--bad); }

/* Specs */
.stack { display: grid; gap: 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px 20px; padding-top: 14px; }
.facts .v { font-weight: 600; overflow-wrap: anywhere; }
.vin { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vin .mono { font-size: 1.05rem; letter-spacing: .08em; user-select: all; overflow-wrap: anywhere; }
.part { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.part:last-child { border-bottom: 0; padding-bottom: 0; }
.part .pn { font-family: var(--f-mono); font-size: 1rem; color: var(--good); text-align: right; overflow-wrap: anywhere; }
.part .x { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; }
.note { white-space: pre-wrap; overflow-wrap: anywhere; padding-top: 14px; }
.panel .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.panel .hd h2 { font-size: 1.55rem; padding: 0; border: 0; }

/* Log */
.entry { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.entry:last-child { border-bottom: 0; padding-bottom: 0; }
.entry .eh { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
.entry .date { font: 700 1.2rem/1 var(--f-display); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--good); font-weight: 600; }
.entry p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Interval table */
.scroll { overflow-x: auto; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 12px 10px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }

/* List */
.ltally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.ltally div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; }
.ltally b { font: 700 2rem/1 var(--f-display); }
.ltally span { color: var(--muted); font-size: .82rem; }
@media (max-width: 460px) { .ltally { grid-template-columns: repeat(2, 1fr); } }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input { flex: 1 1 220px; width: auto; }
.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; text-decoration: none; color: inherit; align-items: start; }
.card:hover { border-color: var(--muted); }
.card h3 { font-size: 1.5rem; line-height: 1.05; overflow-wrap: anywhere; }
.card .meta { grid-column: 1 / -1; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.card .next { grid-column: 1 / -1; font-size: .9rem; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 40px 20px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-size: 1.8rem; }
.empty p { margin: 0; max-width: 44ch; color: var(--muted); }

/* Forms */
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; padding-top: 14px; }
.fgrid .wide { grid-column: 1 / -1; }
.rep { display: grid; gap: 10px; padding-top: 14px; }
.reprow { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; padding: 14px; background: var(--raised); border-radius: 12px; }
.reprow .w2 { grid-column: span 2; }
.reprow .rm { justify-self: end; }
@media (max-width: 520px) { .reprow .w2 { grid-column: 1 / -1; } }
.checks { display: grid; gap: 8px; }
.checks label { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--raised); border-radius: 12px; cursor: pointer; }
.checks input { width: 22px; height: 22px; flex: none; accent-color: var(--green); }
.formfoot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.dangerzone { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 22px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: .92rem; z-index: 20; max-width: calc(100% - 32px); }
.banner { padding: 10px 14px; border-radius: 12px; background: var(--chip); color: var(--warn); font-size: .88rem; margin-bottom: 14px; }

/* v3 additions */
.tabs { grid-template-columns: repeat(5, 1fr); }
.tabs button { font-size: .92rem; padding: 8px 2px; }
.toast { display: flex; align-items: center; gap: 14px; }
.toastbtn { min-height: 32px; padding: 6px 12px; border-color: var(--bg); color: var(--bg); font-weight: 700; }
.card { cursor: pointer; }
.meterrow { grid-column: 1 / -1; display: flex; }
.meterchip { min-height: 38px; padding: 7px 12px; border-radius: 999px; background: var(--raised); border-color: var(--line); font: 600 .95rem/1 var(--f-body); gap: 8px; }
.meterchip .pen { color: var(--good); font-size: .9rem; }
.quickmeter { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
.quickmeter input { flex: 1 1 120px; width: auto; }
.kids { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.kid, .kidrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: .92rem; }
.kidrow { padding: 14px 0; border-bottom: 1px solid var(--line); }
.kidrow:last-child { border-bottom: 0; padding-bottom: 0; }
.inl { color: var(--good); text-decoration: none; font-weight: 600; }
.inl:hover { text-decoration: underline; }
.confirmbox { display: grid; gap: 10px; margin-top: 14px; padding: 12px 14px; background: var(--raised); border-radius: 12px; }
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="empty"><h2>Loading equipment…</h2><p>Connecting to the shared log.</p></div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="app.js?v=4"></script>
</body>
</html>
